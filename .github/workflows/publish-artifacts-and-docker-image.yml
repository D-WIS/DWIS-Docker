name: Publish artifacts and push docker image

on:
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run tests
        run: dotnet test main/src/DWIS.Docker/DWIS.Docker.Core.Tests/DWIS.Docker.Core.Tests.csproj

      - name: Publish web app (win-x64)
        run: |
          mkdir publish
          dotnet publish main/src/DWIS.Docker/DWIS.Docker.Web/DWIS.Docker.Web.csproj -c Release -o publish --runtime win-x64 --self-contained false

      - name: Upload publish folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwis-docker-latest-win-x64
          path: publish/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web app image
        uses: docker/build-push-action@v6
        with:
          context: main/src/DWIS.Docker
          file: main/src/DWIS.Docker/DWIS.Docker.Web/Dockerfile
          tags: digiwells/dwis-docker:stable
          push: true

      - name: Build and push app updater image
        uses: docker/build-push-action@v6
        with:
          context: main/src/DWIS.Docker
          file: main/src/DWIS.Docker/DWIS.Docker.AppUpdater/Dockerfile
          tags: digiwells/dwis-app-update:stable
          push: true
